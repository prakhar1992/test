<!DOCTYPE html>
<html>
<head>
    <title>User Registration and Sign-in</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .error-message {
            color: red;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>User Registration</h1>
    <div id="registration-form">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" data-testid="username" name="username">
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" data-testid="password" name="password">
        </div>
        <div class="form-group">
            <button id="register-button" data-testid="register-button">Register</button>
        </div>
        <div id="registration-error" class="error-message" data-testid="registration-error"></div>
    </div>

    <h1>User Sign-in</h1>
    <div id="signin-form">
        <div class="form-group">
            <label for="signin-username">Username:</label>
            <input type="text" id="signin-username" data-testid="signin-username" name="signin-username">
        </div>
        <div class="form-group">
            <label for="signin-password">Password:</label>
            <input type="password" id="signin-password" data-testid="signin-password" name="signin-password">
        </div>
        <div class="form-group">
            <button id="signin-button" data-testid="signin-button">Sign In</button>
        </div>
        <div id="signin-error" class="error-message" data-testid="signin-error"></div>
    </div>

    <script>
      // Placeholder for JavaScript (will be replaced by actual logic)
      document.getElementById('register-button').addEventListener('click', () => {
        alert('Registration button clicked (placeholder)');
      });
      document.getElementById('signin-button').addEventListener('click', () => {
        alert('Sign In button clicked (placeholder)');
      });
    </script>
</body>
</html>
